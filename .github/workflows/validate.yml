name: Validate public Agent Skill

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate skill package
        run: python3 scripts/validate_package.py

      - name: Check generated files are up to date
        run: |
          python3 scripts/build-api-reference.py --check
          python3 scripts/build-platform-files.py --check

      - name: Check MCP server syntax
        run: node --check packages/fieldtwin-mcp/index.js

      - name: Check shell scripts
        run: |
          bash -n create.sh
          bash -n install.sh
          bash -n update.sh

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/vscode-extension

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test against this repository's skills and guides
        run: npm test
